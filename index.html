<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Romaneio do Dia — Painel de Entregas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg: #12181a;
  --panel: #1b2224;
  --panel-2: #202a2c;
  --border: #2b3538;
  --text: #edefea;
  --text-dim: #93a19d;
  --text-faint: #5f6d69;
  --amber: #e8a33d;
  --amber-dim: #4a3a20;
  --teal: #4fa491;
  --teal-dim: #1c3733;
  --rust: #c1553b;
  --rust-dim: #3c231d;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  background-image:
    radial-gradient(circle at 10% 0%, rgba(232,163,61,0.06), transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(79,164,145,0.06), transparent 40%);
  min-height: 100vh;
  padding-bottom: 40px;
}

.wrap{ max-width: 1280px; margin: 0 auto; padding: 28px 24px 0; }

/* ===== HEADER ===== */
header{
  display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;
  padding-bottom: 20px;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.18em;
  color: var(--amber); text-transform: uppercase; margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.eyebrow::before{ content:''; width:7px; height:7px; background:var(--amber); border-radius:1px; display:inline-block; }
h1{
  font-family:'Oswald', sans-serif; font-weight:700; font-size:40px; letter-spacing:0.01em;
  text-transform:uppercase; line-height:1;
}
h1 span{ color: var(--text-dim); font-weight:400; }
.header-meta{
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-dim); text-align:right;
  line-height:1.6;
}
.header-meta b{ color:var(--text); }

.road-divider{
  height:2px; width:100%;
  background-image: repeating-linear-gradient(90deg, var(--amber) 0 18px, transparent 18px 34px);
  opacity:0.5; margin-bottom: 24px;
}

/* ===== KPI ROW ===== */
.kpis{
  display:grid; grid-template-columns: repeat(6, 1fr); gap:12px; margin-bottom: 28px;
}
@media (max-width: 980px){ .kpis{ grid-template-columns: repeat(3, 1fr);} }
@media (max-width: 560px){ .kpis{ grid-template-columns: repeat(2, 1fr);} }
.kpi{
  background: var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px;
  position:relative; overflow:hidden;
}
.kpi::after{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--amber);
}
.kpi.teal::after{ background: var(--teal); }
.kpi-label{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  color: var(--text-dim); margin-bottom:6px;
}
.kpi-value{ font-family:'Oswald', sans-serif; font-size:30px; font-weight:600; }

/* ===== LAYOUT ===== */
.layout{ display:grid; grid-template-columns: 300px 1fr; gap:20px; align-items:start; }
@media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

.panel{
  background: var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden;
}
.panel-head{
  padding: 14px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.panel-title{
  font-family:'Oswald', sans-serif; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text);
}
.panel-sub{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--text-faint); }

/* sidebar */
#search-vendedor{
  width:100%; background: var(--panel-2); border:1px solid var(--border); border-radius:5px;
  color:var(--text); font-family:'Inter',sans-serif; font-size:13px; padding:9px 10px; outline:none;
}
#search-vendedor::placeholder{ color: var(--text-faint); }
#search-vendedor:focus{ border-color: var(--amber); }
.sidebar-body{ padding: 10px; max-height: 640px; overflow-y:auto; }
.vend-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 10px; border-radius:5px; cursor:pointer; margin-bottom:3px;
  border:1px solid transparent;
}
.vend-item:hover{ background: var(--panel-2); }
.vend-item.active{ background: var(--amber-dim); border-color: var(--amber); }
.vend-name{ font-size:12.5px; line-height:1.3; }
.vend-item.active .vend-name{ color: var(--amber); font-weight:600; }
.vend-count{
  font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-dim);
  background: var(--panel-2); border:1px solid var(--border); border-radius:20px; padding:2px 8px; min-width:26px; text-align:center;
}
.vend-item.active .vend-count{ color: var(--amber); border-color: var(--amber); }
.vend-item.all{ border-bottom:1px dashed var(--border); border-radius:0; margin-bottom:8px; padding-bottom:14px; }

/* main content */
#main-panel-body{ padding: 18px; }

/* bar list */
.barlist{ display:flex; flex-direction:column; gap:9px; }
.bar-row{ display:grid; grid-template-columns: 150px 1fr 42px; align-items:center; gap:10px; }
.bar-label{ font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track{ height:8px; background: var(--panel-2); border-radius:4px; overflow:hidden; }
.bar-fill{ height:100%; background: linear-gradient(90deg, var(--amber), #f0bd6e); border-radius:4px; }
.bar-fill.teal{ background: linear-gradient(90deg, var(--teal), #7ecdbc); }
.bar-num{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--text-dim); text-align:right; }

.grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
@media (max-width: 700px){ .grid-2{ grid-template-columns: 1fr; } }

.section-title{
  font-family:'Oswald', sans-serif; font-size:13px; letter-spacing:0.06em; text-transform:uppercase;
  color: var(--text-dim); margin: 22px 0 12px; display:flex; align-items:center; gap:8px;
}
.section-title:first-child{ margin-top:0; }
.section-title::before{ content:''; width:14px; height:1px; background:var(--amber); display:inline-block; }

/* vendor view kpis */
.vend-kpis{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom:18px; }
@media (max-width:640px){ .vend-kpis{ grid-template-columns: repeat(2,1fr);} }
.vend-kpi{ background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:12px 14px; }
.vend-kpi .kpi-label{ margin-bottom:4px; }
.vend-kpi .kpi-value{ font-size:22px; }

/* search box for table */
.table-tools{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
#search-cliente{
  flex:1; min-width:200px; background: var(--panel-2); border:1px solid var(--border); border-radius:5px;
  color:var(--text); font-family:'Inter',sans-serif; font-size:13px; padding:9px 10px; outline:none;
}
#search-cliente:focus{ border-color: var(--teal); }
.count-badge{
  font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim);
  border:1px solid var(--border); border-radius:20px; padding:6px 12px; white-space:nowrap;
}

/* manifest ticket cards */
.tickets{ display:flex; flex-direction:column; gap:10px; }
.ticket{
  position:relative; background: var(--panel-2); border:1px solid var(--border); border-radius:6px;
  padding: 14px 16px; display:grid; grid-template-columns: 1fr auto; gap:10px 16px; align-items:center;
}
.ticket::before{
  content:''; position:absolute; left:0; top:8px; bottom:8px; width:0;
  border-left: 1px dashed var(--border);
}
.ticket-main{ padding-left: 12px; }
.ticket-client{ font-size:14px; font-weight:600; color:var(--text); margin-bottom:3px; }
.ticket-city{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--teal); text-transform:uppercase; letter-spacing:0.04em; }
.ticket-meta{
  font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-faint); margin-top:6px;
  display:flex; flex-wrap:wrap; gap:4px 14px;
}
.ticket-tags{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.tag{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:4px 9px; border-radius:20px;
  border:1px solid var(--border); color:var(--text-dim); white-space:nowrap;
}
.tag.pay{ background: var(--teal-dim); border-color: var(--teal); color:#a9e0d3; }
.tag.pay.urgent{ background: var(--rust-dim); border-color: var(--rust); color:#f0a894; }
.tag.nf{ background: var(--amber-dim); border-color: var(--amber); color:#f5cf94; }

.empty-state{ padding: 40px 10px; text-align:center; color: var(--text-faint); font-family:'IBM Plex Mono', monospace; font-size:12.5px; }

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius:4px; }
::-webkit-scrollbar-track{ background: transparent; }

/* ===== MUFFATO PANEL ===== */
.muffato-panel{
  border:1px solid var(--amber); border-radius:8px; overflow:hidden; margin-top:22px;
  background: linear-gradient(180deg, var(--amber-dim), var(--panel-2) 40%);
}
.muffato-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding: 12px 16px; border-bottom:1px solid rgba(232,163,61,0.3);
}
.muffato-title{
  font-family:'Oswald', sans-serif; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color: var(--amber);
}
.muffato-stats{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--text-dim); }
.muffato-list{ padding: 4px 0; }
.muffato-row{
  display:flex; align-items:center; gap:12px; padding:9px 16px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  font-size:12.5px;
}
.muffato-row:last-child{ border-bottom:none; }
.muffato-row:hover{ background: rgba(255,255,255,0.02); }
.muffato-plate{
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; color: var(--amber);
  background: rgba(232,163,61,0.12); border:1px solid rgba(232,163,61,0.35); border-radius:4px;
  padding:3px 8px; white-space:nowrap; flex-shrink:0;
}
.muffato-info{
  flex:1; min-width:0; color: var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.muffato-info b{ color: var(--text); font-weight:600; }
.muffato-nf{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; color: var(--text-faint);
  flex-shrink:0; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  cursor: help; text-align:right;
}
@media (max-width: 720px){
  .muffato-row{ flex-wrap:wrap; }
  .muffato-info{ white-space:normal; order:3; width:100%; }
  .muffato-nf{ max-width:none; }
}

/* ===== TOOLBAR (export buttons, compact, top of page) ===== */
.toolbar-top{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding: 10px 0 16px;
}
.toolbar-label{
  font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color: var(--text-faint); margin-right:2px;
}
.toolbar-sep{ width:1px; height:18px; background: var(--border); margin: 0 2px; }
.btn-export{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.02em;
  background: var(--panel-2); border:1px solid var(--border); color:var(--text);
  border-radius:5px; padding:7px 12px; cursor:pointer; display:flex; align-items:center; gap:6px;
  transition: border-color .15s, color .15s; white-space:nowrap;
}
.btn-export:hover{ border-color: var(--amber); color: var(--amber); }
.btn-export.teal:hover{ border-color: var(--teal); color: var(--teal); }
.btn-export svg{ width:12px; height:12px; flex-shrink:0; }
.btn-export:disabled{ opacity:0.5; cursor:wait; }
.pdf-select{
  font-family:'IBM Plex Mono', monospace; font-size:11px; background: var(--panel-2);
  border:1px solid var(--border); color:var(--text); border-radius:5px; padding:7px 8px;
  outline:none; max-width:200px;
}
.pdf-select:focus{ border-color: var(--amber); }

/* ===== RESPONSIVE: TABLET / MOBILE ===== */
@media (max-width: 720px){
  .wrap{ padding: 18px 14px 0; }
  h1{ font-size:28px; }
  .header-meta{ text-align:left; font-size:11px; }
  .kpi-value{ font-size:24px; }
  .bar-row{ grid-template-columns: 96px 1fr 34px; gap:8px; }
  .bar-label{ font-size:11px; }
  .ticket{ grid-template-columns: 1fr; }
  .ticket-tags{ flex-direction:row; align-items:center; justify-content:flex-start; }
  .vend-kpis{ grid-template-columns: repeat(2,1fr); }
  .sidebar-body{ max-height: 320px; }
  footer{ padding: 0 14px; }
}
@media (max-width: 420px){
  h1{ font-size:23px; }
  .eyebrow{ font-size:10px; }
  .kpis{ grid-template-columns: repeat(2,1fr); }
  .toolbar-top{ width:100%; }
  .toolbar-sep{ display:none; }
  .pdf-select{ max-width:none; flex:1; }
  .btn-export{ flex:1; justify-content:center; }
}

footer{
  max-width:1280px; margin: 30px auto 0; padding: 0 24px; font-family:'IBM Plex Mono', monospace;
  font-size:11px; color: var(--text-faint); border-top:1px solid var(--border); padding-top:16px;
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Painel de Entregas · Uso Interno</div>
      <h1>Romaneio do Dia <span id="date-label"></span></h1>

    <span class="toolbar-sep"></span>
    <select id="select-vendedor" class="pdf-select"></select>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>

  <div class="layout">

      <div id="main-panel-body"></div>
    </div>
  </div>
  </div>

  <footer>
    Fonte: planilha de romaneio de entregas (VAREJO_08_07) · <span id="footer-count"></span> registros · Painel gerado automaticamente para orientação da equipe comercial.
  </footer>
</div>

function countBy(arr, key){
  const m = new Map();
  arr.forEach(r=>{
    const k = r[key];
    m.set(k, (m.get(k)||0)+1);
  });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function distinctCount(arr, key){
  return new Set(arr.map(r=>r[key])).size;
}

function barList(pairs, maxN=8, teal=false){
  const top = pairs.slice(0, maxN);
  const max = top.length ? top[0][1] : 1;
  return `<div class="barlist">` + top.map(([label,count])=>`
    <div class="bar-row">
      <div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill ${teal?'teal':''}" style="width:${(count/max*100).toFixed(1)}%"></div></div>
      <div class="bar-num">${count}</div>
    </div>
  `).join('') + `</div>`;
}

function getMuffatoGroups(){
  const rows = DATA.filter(r => /muffato/i.test(r.DS_CLIENTE));
  const groupsMap = new Map();
  rows.forEach(r => {
    const key = `${r.PLACA} — ${r.DS_TRANSP}`;
    if(!groupsMap.has(key)) groupsMap.set(key, { placa: r.PLACA, transp: r.DS_TRANSP, motorista: r.DS_MOTORISTA, rows: [] });
    groupsMap.get(key).rows.push(r);
  });
  return [...groupsMap.values()].sort((a,b)=> b.rows.length - a.rows.length);
}

function renderMuffatoPanel(){
  const groups = getMuffatoGroups();

// ======= EXPORTAÇÃO EM PDF =======
function formatDateBR(){
  return new Date().toLocaleDateString('pt-BR').split('/').join('-');
}

function buildPdf(title, groups, groupLabelPrefix, columns){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  let first = true;

  groups.forEach(([groupName, rows]) => {
    if(!first) doc.addPage();
    first = false;

    doc.setFontSize(14);
    doc.setTextColor(30,30,30);
    doc.text(title, 40, 40);
    doc.setFontSize(10);
    doc.setTextColor(100,100,100);
    doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')}`, 40, 56);

    doc.setFontSize(12);
    doc.setTextColor(20,20,20);
    doc.text(`${groupLabelPrefix}: ${groupName}   (${rows.length} entrega${rows.length>1?'s':''})`, 40, 78);

    doc.autoTable({
      startY: 90,
      head: [columns.map(c=>c.header)],
      body: rows.map(r => columns.map(c => c.get(r))),
      styles: { fontSize: 8.5, cellPadding: 5 },
      headStyles: { fillColor: [30,40,42], textColor: [255,255,255] },
      alternateRowStyles: { fillColor: [245,245,242] },
      margin: { left: 40, right: 40 },
    });
  });

  return doc;
}

function exportPorVeiculo(filterKey){
  const groupsMap = new Map();
  DATA.forEach(r => {
    const key = `${r.PLACA} — ${r.DS_TRANSP}`;
    if(!groupsMap.has(key)) groupsMap.set(key, []);
    groupsMap.get(key).push(r);
  });
  let groups = [...groupsMap.entries()].sort((a,b)=> a[0].localeCompare(b[0]));
  let fileTag = 'todos';
  if(filterKey && filterKey !== '__all__'){
    groups = groups.filter(([key]) => key === filterKey);
    fileTag = filterKey.split(' — ')[0].replace(/[^a-zA-Z0-9]/g,'');
  }

  const columns = [
    { header: 'NF', get: r => r.NR_NF },
    { header: 'Pedido', get: r => r.PEDIDO },
    { header: 'Cliente', get: r => r.DS_CLIENTE },
    { header: 'Cidade', get: r => r.CIDADE },
    { header: 'Motorista', get: r => r.DS_MOTORISTA },
    { header: 'Vendedor', get: r => r.NOME_VENDEDOR },
    { header: 'Cond. Pagto', get: r => r.COND_PGTO_CLIENTE },
  ];

  const doc = buildPdf('Romaneio do Dia — Entregas por Veículo', groups, 'Veículo / Transportadora', columns);
  doc.save(`romaneio_veiculo_${fileTag}_${formatDateBR()}.pdf`);
}

function exportPorVendedor(filterKey){
  const groupsMap = new Map();
  DATA.forEach(r => {
    const key = r.NOME_VENDEDOR || '(sem vendedor)';
    if(!groupsMap.has(key)) groupsMap.set(key, []);
    groupsMap.get(key).push(r);
  });
  let groups = [...groupsMap.entries()].sort((a,b)=> b[1].length - a[1].length);
  let fileTag = 'todos';
  if(filterKey && filterKey !== '__all__'){
    groups = groups.filter(([key]) => key === filterKey);
    fileTag = filterKey.replace(/[^a-zA-Z0-9]/g,'_').slice(0,30);
  }

  const columns = [
    { header: 'NF', get: r => r.NR_NF },
    { header: 'Pedido', get: r => r.PEDIDO },
    { header: 'Cliente', get: r => r.DS_CLIENTE },
    { header: 'Cidade', get: r => r.CIDADE },
    { header: 'Transportadora', get: r => r.DS_TRANSP },
    { header: 'Placa', get: r => r.PLACA },
    { header: 'Cond. Pagto', get: r => r.COND_PGTO_CLIENTE },
  ];

  const doc = buildPdf('Romaneio do Dia — Entregas por Vendedor', groups, 'Vendedor', columns);
  doc.save(`romaneio_vendedor_${fileTag}_${formatDateBR()}.pdf`);
}

  const selP = document.getElementById('select-vendedor');
  if(btnV) btnV.onclick = () => { btnV.disabled = true; setTimeout(()=>{ try{ exportPorVeiculo(selV.value); } finally { btnV.disabled = false; } }, 10); };
  if(btnP) btnP.onclick = () => { btnP.disabled = true; setTimeout(()=>{ try{ exportPorVendedor(selP.value); } finally { btnP.disabled = false; } }, 10); };
}



// ======= CARREGAMENTO DOS DADOS =======
function showBanner(text, kind){
  const el = document.getElementById('status-banner');
  el.style.display = 'flex';
  const colors = {
    demo:  {bg:'var(--amber-dim)', border:'var(--amber)', color:'#f5cf94'},
    live:  {bg:'var(--teal-dim)',  border:'var(--teal)',  color:'#a9e0d3'},
    error: {bg:'var(--rust-dim)',  border:'var(--rust)',  color:'#f0a894'},
  };
  const c = colors[kind] || colors.demo;
  el.style.background = c.bg;
  el.style.border = `1px solid ${c.border}`;
  el.style.color = c.color;
  el.innerHTML = `<span>${text}</span><button id="refresh-btn" style="font-family:'IBM Plex Mono',monospace; font-size:11px; background:transparent; border:1px solid ${c.border}; color:${c.color}; border-radius:20px; padding:4px 12px; cursor:pointer;">Atualizar agora</button>`;
  document.getElementById('refresh-btn').addEventListener('click', loadData);
}

function dedupeRows(rows){
  const seen = new Set();
  const out = [];
  for(const r of rows){
    const key = [r.NR_ROMANEIO,r.NR_NF,r.PEDIDO,r.DS_CLIENTE,r.DS_TRANSP,r.DS_MOTORISTA,r.PLACA,r.CIDADE,r.NOME_VENDEDOR,r.COND_PGTO_CLIENTE].join('|');
    if(!seen.has(key)){ seen.add(key); out.push(r); }
  }
  return out;
}

function normalizeRow(r){
  return {
    FILIAL: (r.FILIAL||'').toString().trim(),
    NR_ROMANEIO: (r.NR_ROMANEIO||'').toString().trim(),
    NR_NF: (r.NR_NF||'').toString().trim(),
    PEDIDO: (r.PEDIDO||'').toString().trim(),
    DS_TRANSP: (r.DS_TRANSP||'').toString().trim(),
    DS_MOTORISTA: (r.DS_MOTORISTA||'').toString().trim(),
    PLACA: (r.PLACA||'').toString().trim(),
    DS_CLIENTE: (r.DS_CLIENTE||'').toString().trim(),
    CIDADE: (r.CIDADE||'').toString().trim().toUpperCase(),
    NOME_VENDEDOR: (r.NOME_VENDEDOR||'').toString().trim(),
    COND_PGTO_CLIENTE: (r.COND_PGTO_CLIENTE||'').toString().trim(),
  };
}

async function loadData(){
  document.getElementById('dashboard-content').style.display = 'none';
  document.getElementById('loading-state').style.display = 'block';
  document.getElementById('loading-state').textContent = 'Carregando dados do romaneio...';

  if(!CSV_URL || !CSV_URL.trim()){
    DATA = dedupeRows(DATA_FALLBACK);
    showBanner('⚠ Modo de exemplo — mostrando o romaneio de 08/07. Configure CSV_URL no código para atualizar automaticamente todo dia.', 'demo');
    finishLoad();
    return;
  }

  try{
    const res = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    const rows = dedupeRows(parsed.data.map(normalizeRow).filter(r => r.DS_CLIENTE));
    if(rows.length === 0) throw new Error('Nenhuma linha válida encontrada na planilha.');
    DATA = rows;
    const now = new Date();
    showBanner(`● Dados ao vivo — atualizado às ${now.toLocaleTimeString('pt-BR')}`, 'live');
    finishLoad();
  }catch(err){
    console.error(err);
    DATA = dedupeRows(DATA_FALLBACK);
    showBanner('⚠ Não foi possível carregar a planilha configurada. Mostrando dados de exemplo (08/07).', 'error');
    finishLoad();
  }
}

function finishLoad(){
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('dashboard-content').style.display = 'block';
  init();
}

loadData();
</script>
